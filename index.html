ت العامة"],["Britain in the World: Challenges and Futures","بريطانيا في العالم: التحديات والمستقبل"]];

const L={
1:{sp:"Introduce yourself, describe your daily routine, then ask your partner two follow-up questions.",
v:[["introduce","verb","يُقدِّم / يُعرِّف","Let me introduce myself."],["Nice to meet you","expression","تشرّفتُ بمعرفتك","Nice to meet you, Amina."],["originally from","expression","أصلي من","I'm originally from Casablanca."],["routine","noun","روتين","My morning routine is simple."],["commute","noun","التنقّل اليومي","My commute takes forty minutes."],["How about you?","expression","وأنت؟","I love tea. How about you?"],["get up","phrasal verb","يستيقظ","I get up at six."],["flat","noun","شقة (برحلتك مع الإنجليزية)","I share a flat near the university."]],
l:{
B1:{o:"Introduce yourself, ask follow-up questions and describe your routine.",
t:"Hi, I'm Sara. I'm from Leeds, but I live in London now. I'm a student. I get up at seven and I take the bus to college. In the evening I cook dinner and call my family.",
q:[["Where does Sara live now?",["Leeds","London","Cardiff"],1,"She is from Leeds but lives in London now."],["How does she get to college?",["By bus","On foot","By train"],0,"'I take the bus to college.'"]],
g:["Present simple vs present continuous","Use the present simple for routines (I get up at seven) and the present continuous for actions happening now (I'm working). Common mistake: ✗ I am go to work every day.",[["At the moment, I ___ in a café.",["work","am working","works"],1,"'At the moment' signals an action in progress."]]],
w:["Write one paragraph (topic sentence, supporting sentences, concluding sentence) about yourself and your daily routine.","My name is Sara and I'm from Leeds, but I live in London now. First, I get up at seven. Then I take the bus to college because it is cheap. In the evening I cook dinner and call my family. I love my routine because it is simple."]},
B2:{o:"Hold a natural conversation, ask indirect questions and explain how your routine changes.",
t:"My name's Omar and I'm originally from Birmingham, although I've lived in Manchester for years. I work as a nurse, so my routine changes every week. This week I'm working nights, which means I sleep in the morning and meet friends in the afternoon.",
q:[["What is the main idea?",["Omar hates his job","Omar's routine changes with his shifts","Omar is moving city"],1,"He works different shifts, so his routine changes."],["When does Omar sleep this week?",["In the morning","At night","In the afternoon"],0,"He works nights, so he sleeps in the morning."]],
g:["Indirect questions","Use statement word order after polite openers: Could you tell me where the library is? Common mistake: ✗ Could you tell me where is the library?",[["Could you tell me where ___?",["the library is","is the library","does the library"],0,"After 'tell me where', use normal word order: subject + verb."]]],
w:["Write a paragraph introducing yourself and explain how your routine has changed recently.","I'm Omar, and I work as a nurse in Manchester. Although my routine used to be predictable, it has changed recently because I'm working nights. For example, I sleep in the morning and see friends in the afternoon. Therefore, I plan my week carefully."]},
C1:{o:"Handle small talk with nuance, express attitude and discuss identity in a layered, reflective way.",
t:"Asked where I'm from, I tend to hesitate: I was born in Glasgow, raised in Cardiff and, for better or worse, shaped by years in London. People assume that a fluid answer signals indecision; I'd argue it reflects a layered identity. Small talk, after all, is rarely about facts.",
q:[["What does the speaker say about small talk?",["It is all about facts","It is rarely only about facts","It is unnecessary"],1,"'Small talk is rarely about facts.'"],["Why does the speaker hesitate?",["Their identity is layered","They forgot","They dislike London"],0,"They argue a fluid answer reflects a layered identity."]],
g:["Habitual aspect and nuance","'Is always + -ing' expresses irritation; 'tend to' and 'will' describe typical behaviour (He will sit there for hours). Use them to show attitude, not just frequency.",[["He ___ leaving his things everywhere; it's so irritating!",["is always","has always","always is"],0,"'Is always + -ing' conveys annoyance."]]],
w:["Write a short essay (introduction, body, conclusion) on how first impressions shape small talk.","First impressions matter, yet their influence on small talk is often overstated.\n\nWhereas some people judge within seconds, others remain open to revision. Consequently, skilled conversationalists listen first and speak second.\n\nNevertheless, a warm opening arguably sets the tone for everything that follows."]}}},
2:{sp:"Describe your family or your home and neighbourhood, then ask your partner about theirs.",
v:[["extended family","noun","العائلة الممتدة","My extended family lives nearby."],["neighbourhood","noun","حيّ","It's a quiet neighbourhood."],["next door","adverb","في الجوار / المجاور","Our neighbours live next door."],["cosy","adjective","دافئ ومريح","The flat is small but cosy."],["move in","phrasal verb","ينتقل للسكن في","We moved in last month."],["within walking distance","expression","على مسافة قريبة سيرًا","The shops are within walking distance."]],
l:{
B1:{o:"Describe your family, your home and your neighbourhood using have got and there is/are.",
t:"I live with my parents and my two brothers in a small house in Bristol. There is a park near our house and there are two shops next door. My father has got a blue car. My mum works at a school. I love my neighbourhood because it is quiet and friendly.",
q:[["How many brothers does the speaker have?",["One","Two","Three"],1,"'my two brothers'."],["Why does the speaker like the neighbourhood?",["It is quiet and friendly","It is big","It is cheap"],0,"'because it is quiet and friendly'."]],
g:["There is / there are and have got","Use there is / there are to say what exists in a place (There is a park near our house). Use have got for possession and family (My father has got a car). Common mistake: ✗ There is two shops.",[["There ___ two shops next door.",["is","are","has"],1,"A plural noun needs 'there are'."]]],
w:["Write a paragraph about your family and your home.","I live with my parents and my sister in a flat in Leeds. There are three rooms and a small kitchen. My father has got a job in a hospital. Because our neighbours are kind, I like my street. At weekends, we visit my grandparents."]},
B2:{o:"Describe people and places in detail with relative clauses and compare family life across generations.",
t:"The house where I grew up is in a village that has barely changed in fifty years. My grandmother, who lived next door, looked after us while my parents were at work. Although my own flat is in the city centre, I often miss the neighbours who knew everyone by name.",
q:[["What is the speaker's attitude to the village?",["Nostalgic","Angry","Bored"],0,"They miss the neighbours and village life."],["Who looked after the children?",["Their grandmother","A neighbour","A teacher"],0,"'My grandmother ... looked after us.'"]],
g:["Defining and non-defining relative clauses","Use who / which / that without commas to identify (the neighbours who knew everyone) and with commas to add extra information (my grandmother, who lived next door). Common mistake: ✗ the house where I grew up in.",[["My grandmother, ___ lived next door, looked after us.",["who","that","which"],0,"With commas and a person, use 'who' (not 'that')."]]],
w:["Write a paragraph describing a place you know well and the people who live there.","The village where I grew up is small and peaceful. My grandmother, who lived next door, often cooked for us. Although the village has few shops, everybody helps each other. Therefore, I still visit every summer, which keeps me close to my roots."]},
C1:{o:"Describe places and relationships with precision, using participle clauses and reflective language.",
t:"Having moved four times before the age of twelve, I have come to regard 'home' less as an address than as a set of habits: a certain way of laying the table, a language spoken at breakfast. Neighbourhoods, tightly knit or anonymous, shape us less than we assume; what endures is the household.",
q:[["What does 'home' mean for the speaker?",["A fixed address","Habits shared with family","The oldest house"],1,"Home is 'a set of habits'."],["What is implied about neighbourhoods?",["They matter less than often thought","They are all anonymous","They cause moving"],0,"They 'shape us less than we assume'."]],
g:["Participle clauses for description","Participle clauses add information concisely: Having moved four times, I value routine. A house built in 1900 needs repairs. They avoid repeating the subject and make writing more fluent.",[["___ four times, she learned to adapt quickly.",["Having moved","Moving was","Moved has"],0,"The perfect participle shows an earlier action by the same subject."]]],
w:["Write a short essay (introduction, body, conclusion) on what makes a place feel like home.","A house becomes a home through shared habits rather than walls.\n\nWhereas an address can change, routines endure. Consequently, families who move often rebuild belonging around daily rituals.\n\nNevertheless, a welcoming neighbourhood arguably deepens that sense of belonging."]}}},
3:{sp:"Talk about an experience you have had and an interest you enjoy. Ask your partner a follow-up question.",
v:[["catch up","phrasal verb","يتواصل بعد انقطاع","Let's catch up soon."],["I'm keen on","expression","أنا متحمّس لـ","I'm keen on photography."],["Really?","discourse marker","حقًّا؟","'I've been to Wales.' 'Really?'"],["I couldn't agree more","expression","أوافق تمامًا","I couldn't agree more."],["hobby","noun","هواية","Reading is my hobby."],["Could you repeat that?","expression","هل يمكنك أن تعيد ذلك؟","Sorry, could you repeat that?"]],
l:{
B1:{o:"Talk about experiences and hobbies, and show interest with short questions.",
t:"Tom and Lily talk after class. Lily says, 'I love hiking.' Tom says, 'Really? I've never tried it.' Lily says, 'Come with me on Saturday!' Tom says, 'Sounds great. I'd love to.'",
q:[["What is the main idea?",["They plan to go hiking","They argue","They study"],0,"Lily invites Tom and he accepts."],["Has Tom been hiking before?",["Yes","No","Twice"],1,"'I've never tried it.'"]],
g:["Present perfect vs past simple","Use the present perfect for life experience (Have you ever been to Wales?) and the past simple for finished times (I went in 2019). Common mistake: ✗ I have been there yesterday.",[["I ___ to Wales twice.",["have been","went","was going"],0,"Life experience with no finished time uses the present perfect."]]],
w:["Write a paragraph about an interesting experience or hobby.","I love hiking. Last year I went to Wales with my friends. We walked for six hours and the views were beautiful. Although it was tiring, I felt happy. I want to go again because hiking is relaxing."]},
B2:{o:"Compare interests, agree and disagree politely, and explain what you enjoy and why.",
t:"Mia has been learning the guitar for six months, but Jack is more of a football person. 'I couldn't agree more that sport is great,' says Mia, 'though I find music more relaxing.' Jack laughs: 'Fair enough. Each to their own!'",
q:[["How do they treat their different interests?",["They argue angrily","They respect each other's choices","They avoid the subject"],1,"'Each to their own' shows tolerance."],["How long has Mia played the guitar?",["Six months","Six years","Since school"],0,"'for six months'."]],
g:["Present perfect continuous","Use it for an activity continuing up to now: I've been learning the guitar for six months. Use 'for' + duration and 'since' + a starting point.",[["I ___ photography for three years.",["am doing","have been doing","did"],1,"Activity continuing up to now + 'for' = present perfect continuous."]]],
w:["Write a paragraph comparing two interests and explain which you prefer.","I enjoy both football and photography, but I prefer photography. For example, I can take photos alone and relax. However, football is better for friendship. Therefore, I play with friends on Fridays and take photos at the weekend."]},
C1:{o:"Read between the lines of British small talk and express nuanced agreement and disagreement.",
t:"What strikes me about British small talk is its indirectness: a compliment is often met with a self-deprecating remark, and disagreement arrives wrapped in qualifiers such as 'I suppose' or 'to a certain extent'. Learners who take such phrases literally may miss the speaker's true stance.",
q:[["What is the speaker's main point?",["British people are rude","British small talk is often indirect","Compliments are rare"],1,"The text focuses on indirectness."],["What does 'I suppose so' most likely signal?",["Strong agreement","Reluctant or partial agreement","Total refusal"],1,"Qualifiers soften disagreement or signal partial agreement."]],
g:["Cleft sentences for emphasis","Cleft sentences add emphasis: What I enjoy most is meeting new people. It was the community that drew me in.",[["___ I enjoy most is meeting new people.",["What","That","Which"],0,"'What' introduces the focus in a cleft sentence."]]],
w:["Write a short essay (introduction, body, conclusion) on whether shared interests are essential for friendship.","Shared interests can deepen friendship, yet they are hardly essential.\n\nWhereas hobbies provide topics, values sustain bonds. Consequently, two people who disagree about music may still be close.\n\nNevertheless, a common passion arguably accelerates trust."]}}},
4:{sp:"Meet someone new at a university event: introduce yourself, ask at least three questions, react naturally, find a common interest and end the conversation politely.",
v:[["How's it going?","expression","كيف الحال؟","Hi Sam! How's it going?","An informal greeting asking how someone is."],["What brings you here?","expression","ما الذي جاء بك إلى هنا؟","What brings you here, then?","A question asking why someone is at a place or event."],["Really? Tell me more.","expression","حقًّا؟ أخبرني المزيد","'I've lived in Cairo.' 'Really? Tell me more.'","A way to show interest and invite more detail."],["By the way","discourse marker","بالمناسبة","By the way, are you going to the quiz?","Used to introduce a new, related topic."],["What do you do?","expression","ماذا تعمل؟","'What do you do?' 'I'm a nurse.'","A question about someone's job."],["keep the conversation going","collocation","يُبقي المحادثة مستمرة","Open questions keep the conversation going.","To continue talking so the conversation does not stop."],["common ground","noun","أرضية مشتركة","We found common ground in music.","Interests or opinions that two people share."],["I'd better go","expression","من الأفضل أن أذهب","I'd better go — I've got a lecture.","A polite way to end a conversation."]],
m:[["What brings you here?","I'm starting a master's course."],["How about you?","I'm studying law. And you?"],["Really? Tell me more.","Yes, I lived in Egypt for two years."],["I'd better go.","Of course. Lovely to meet you!"]],
d:[["Sam","Hi, I'm Sam. How's it going?"],["Amira","Good, thanks! I'm Amira. It's my first week here, so I'm a bit nervous."],["Sam","Don't worry, everyone's in the same boat. What brings you to Manchester?"],["Amira","I'm doing a master's in engineering. How about you?"],["Sam","I'm in my second year, studying history. What are you into outside uni?"],["Amira","Mostly football. I play every Sunday."],["Sam","Really? Tell me more. We're looking for players for the university team!"],["Amira","Brilliant! By the way, where do people usually go for lunch?"],["Sam","There's a good café near the library. I'll show you after this, if you like."],["Amira","That would be lovely. Thanks!"]],
rp:[["You are at a university welcome event and you do not know anyone.","Start a conversation, ask three questions and react to the answers.","Useful: Hi, I'm… · What brings you here? · What are you studying? · Really? Tell me more. · How about you?","A: Hi, I'm Amira. How's it going?\nB: Good, thanks. I'm Sam.\nA: What brings you here?\nB: I'm in my second year.\nA: Really? Tell me more. What are you studying?\nB: History. How about you?"],["You have found a common interest and the conversation is ending.","Find common ground, then end politely and keep in touch.","Useful: I'd better go · It was lovely to meet you · Let's keep in touch","A: Oh, you like football too! We should play sometime.\nB: Definitely!\nA: I'd better go — I've got a lecture. Lovely to meet you!\nB: You too. Let's keep in touch!"]],
l:{
B1:{o:"Start a conversation, ask open questions and keep it going with short reactions.",
t:"In Britain, people often start a conversation with a simple question about the weather or the journey. After that, they ask about work or studies. It is polite to ask open questions, like 'What brings you here?', and to listen carefully. Short answers such as 'Fine' can end a conversation too quickly.",
lq:[["Why is Amira nervous?",["It is her first week","She is late","She dislikes football"],0,"She says 'It's my first week here'."],["Amira is studying history. (True or false?)",["True","False"],1,"She studies engineering; Sam studies history."],["What does Sam offer to do?",["Show her the café","Lend her a book","Introduce her to a teacher"],0,"'I'll show you after this.'"]],
rq:[["Why are open questions useful?",["They keep the conversation going","They are shorter","They are about the weather"],0,"Open questions invite longer answers."],["People in Britain only talk about the weather. (True or false?)",["True","False"],1,"They also ask about work or studies."]],
g:["Question forms: subject and object questions","Object questions need an auxiliary (What do you study?). Subject questions do not (Who lives here?). Use the present simple for routines (What do you do?) and the present continuous for now (What are you studying this year?). Common mistakes: ✗ What you do? ✗ Who does live here?",[["Who ___ in that flat?",["lives","does live","is live"],0,"In a subject question, the question word is the subject: no auxiliary."]],[["Where ___ you from?","are","'Where are you from?' uses the verb be."],["What ___ you studying this year?","are","Present continuous for a current period."]]],
w:["Write a short message to a new classmate: introduce yourself and ask two questions.","Hi Sam! I'm Amira. I'm new here and I'm studying engineering. I like football and music. What are you studying? Do you play any sports? Let's have lunch together this week!"]},
B2:{o:"Keep small talk flowing with follow-up questions, natural reactions and polite openers and closers.",
t:"Small talk in Britain works like a warm-up: it is less about the information exchanged than about showing goodwill. A well-placed 'Really? Tell me more' encourages the other person to elaborate, while a follow-up question that picks up their last word shows you have been listening. Answering with one word, however politely, can feel like a closed door.",
lq:[["What does 'everyone's in the same boat' mean?",["Everyone is in a similar situation","Everyone is on a trip","Everyone is leaving"],0,"The idiom means people share the same situation."],["How does Sam keep the conversation going?",["He asks open questions and offers help","He talks only about himself","He changes the subject"],0,"He asks 'What brings you…?' and offers to show her the café."],["Sam is sure Amira will join the team. (True or false?)",["True","False"],1,"He says they are looking for players; he does not assume she will join."]],
rq:[["What is the purpose of British small talk?",["To show goodwill","To exchange facts","To avoid people"],0,"It is 'less about the information … than about showing goodwill'."],["What does 'a closed door' suggest?",["A one-word answer discourages conversation","A rude person","A real door"],0,"The metaphor describes a reply that ends the exchange."]],
g:["Questions that keep conversations going","Use open wh-questions and follow-ups: What made you choose Leeds? How did you find the course? Add reaction tokens (Really? That sounds great). Negative questions can be friendly: Haven't we met before?",[["Which question is the most open?",["Do you like your course?","What do you enjoy most about your course?","Is your course good?"],1,"Wh-questions invite longer answers."]],[["Haven't we ___ before?","met","Past participle in a negative question."],["What made you ___ Leeds?","choose","'Make + object + infinitive without to'."]]],
w:["Write a friendly email to a student you met at an event: remind them who you are, mention a shared interest and suggest meeting.","Hi Sam, it was great to meet you at the welcome event. I really enjoyed our chat about football. As you said, the university team needs players, so I'd love to join. Would you like to grab a coffee on Thursday? Best wishes, Amira"]},
C1:{o:"Open and close conversations with tact, read cues and calibrate register.",
t:"Initiating conversation with a stranger in Britain requires tact: an overly personal opener can seem intrusive, whereas a comment on the shared situation ('Dreadful queue, isn't it?') invites a response without obliging one. Fluency in these rituals is less about vocabulary than about calibrating register and reading cues of willingness.",
lq:[["What does Sam's 'Really? Tell me more.' signal?",["Genuine interest and an invitation to elaborate","Doubt","Boredom"],0,"It shows interest and invites more detail."],["Which phrase lets Amira change topic naturally?",["By the way","Brilliant","Don't worry"],0,"'By the way' introduces a new, related topic."]],
rq:[["Why is a comment on the shared situation effective?",["It invites a reply without pressure","It is very personal","It is formal"],0,"It 'invites a response without obliging one'."],["What does the writer imply about fluency?",["It needs social judgement as well as words","It is only vocabulary","It is rare"],0,"'Less about vocabulary than about calibrating register'."]],
g:["Indirect questions and softening","Indirect questions soften direct ones: I was wondering what brought you here. Do you mind my asking where you're from? A tag can invite agreement: Dreadful weather, isn't it?",[["Which is the most tactful?",["Why are you here?","I was wondering what brought you here.","What do you want?"],1,"Indirect forms soften the question."]],[["I was wondering ___ you do.","what","Indirect question: no inversion."]]],
w:["Write a short essay (introduction, body, conclusion): is small talk a waste of time?","Small talk is often dismissed as trivial, yet it serves a purpose.\n\nWhereas it rarely exchanges useful information, it builds trust. Consequently, strangers become acquaintances.\n\nNevertheless, it arguably matters most when it leads to genuine conversation."]}}},
5:{sp:"Handle five everyday situations in Britain in English only: a café, a station, a shop, a surgery and a street.",
v:[["Could I have…?","expression","هل يمكنني الحصول على…؟","Could I have a flat white, please?","A polite way to ask for something."],["I'm looking for…","expression","أنا أبحث عن…","I'm looking for a birthday card.","Used to say what you want to find."],["How much is it?","expression","كم سعره؟","How much is this jumper?","A question about price."],["take away","phrasal verb","طلب سفري (للخارج)","Is that eat in or take away?","Food or drink bought to consume elsewhere."],["Could you tell me how to get to…?","expression","هل يمكنك أن تخبرني كيف أصل إلى…؟","Could you tell me how to get to the station?","A polite way to ask for directions."],["I'd like to make an appointment","expression","أودّ حجز موعد","I'd like to make an appointment with the dentist.","Used to book a time to see someone."],["I'm afraid…","expression","للأسف…","I'm afraid we're fully booked.","A polite way to give bad news."],["No worries!","expression","لا عليك!","'Sorry I'm late.' 'No worries!'","An informal way to say that it is fine."]],
m:[["Could I have a tea, please?","Of course. Milk and sugar?"],["How much is it?","It's four pounds fifty."],["I'm afraid we're fully booked.","No worries. Have you got anything on Friday?"],["Could you tell me how to get to the library?","Go straight on, then take the second left."]],
d:[["Customer","Hello, could I have a flat white and a slice of carrot cake, please?"],["Barista","Of course. Eat in or take away?"],["Customer","Take away, please. How much is that?"],["Barista","That's six pounds fifty."],["Visitor","Excuse me, could you tell me how to get to the library?"],["Local","Sure. Go straight on, then take the second left. It's opposite the post office."],["Visitor","Second left, opposite the post office. Thanks very much!"],["Local","No worries!"],["Receptionist","Good morning, surgery. How can I help?"],["Patient","I'd like to make an appointment, please."],["Receptionist","I'm afraid there's nothing today. Would Thursday at ten be all right?"],["Patient","Yes, that's fine. Thank you."]],
rp:[["You are in a café in Edinburgh.","Order a drink and something to eat, and ask the price.","Useful: Could I have…? · I'd like… · Eat in or take away? · How much is it?","A: Hello, could I have a tea and a scone, please?\nB: Eat in or take away?\nA: Take away. How much is that?\nB: That's four pounds."],["You are at a railway station.","Ask when the next train to Oxford leaves and from which platform.","Useful: Excuse me, could you help me? · What time… · Which platform…","A: Excuse me, could you help me? What time is the next train to Oxford?\nB: It's at 10.15 from platform 3.\nA: Thank you very much!"],["You are in a bookshop.","Ask for a dictionary and find out the price.","Useful: I'm looking for… · Have you got any…? · How much is it?","A: I'm looking for a dictionary. Have you got any?\nB: Yes, they're on the second floor.\nA: How much is this one?\nB: It's £12.99."],["You are phoning a doctor's surgery.","Make an appointment for next week.","Useful: I'd like to make an appointment · Would … be possible? · I'm afraid…","A: Hello, I'd like to make an appointment, please.\nB: I'm afraid there's nothing on Monday. Would Tuesday be all right?\nA: Yes, that's fine."],["You are lost in a town centre.","Ask for directions to the library and check you understood.","Useful: Could you tell me how to get to…? · Go straight on · Turn left / right · opposite","A: Could you tell me how to get to the library?\nB: Go straight on, then take the second right. It's opposite the bank.\nA: Second right, opposite the bank. Thanks!"]],
l:{
B1:{o:"Order, ask for information, shop, book an appointment and ask for directions politely.",
t:"CAFÉ LILA. Tea £2.20 · Coffee £2.80 · Cheese toastie £5.50 · Carrot cake £3.50. Take-away drinks are 20p cheaper. We are closed on Mondays. Please tell us if you have any allergies.",
lq:[["What does the customer order?",["A flat white and carrot cake","Tea and a sandwich","Coffee only"],0,"'a flat white and a slice of carrot cake'."],["The library is opposite the post office. (True or false?)",["True","False"],0,"'It's opposite the post office.'"],["When is the appointment?",["Today","Thursday at ten","Friday"],1,"'Would Thursday at ten be all right?'"]],
rq:[["How much is a take-away coffee?",["£2.60","£2.80","£3.00"],0,"Take-away drinks are 20p cheaper than £2.80."],["When is the café closed?",["Mondays","Sundays","Never"],0,"'We are closed on Mondays.'"]],
g:["Polite requests, some and any","Use Could I have…? / Can I get…? / I'd like… to order politely; could is more polite than can. Use some in positive sentences and requests (Could I have some water?) and any in negatives and questions (Have you got any milk?).",[["___ I have a glass of water, please?",["Could","Do","Am"],0,"'Could I have…?' is a polite request."]],[["Have you got ___ milk?","any","'Any' is used in questions."],["Could I have ___ sugar, please?","some","'Some' is used in requests."]]],
w:["Write a short message giving directions from the station to your home.","Hi! When you leave the station, turn left. Go straight on for two minutes, then turn right at the café. My house is opposite the park, next to a bakery. Call me if you get lost!"]},
B2:{o:"Deal with services and appointments, understand natural fast speech and give clear directions.",
t:"Dear Ms Hassan, your appointment with Dr Patel is confirmed for Thursday 12 November at 10.00 a.m. Please arrive ten minutes early and bring your appointment card. If you cannot attend, please call us at least 24 hours in advance; otherwise a fee may apply.",
lq:[["Why does the receptionist say 'I'm afraid'?",["To soften bad news","To show fear","To end the call"],0,"It is a polite way to give bad news."],["How does the visitor check the directions?",["By repeating them","By drawing a map","By asking again"],0,"'Second left, opposite the post office.'"],["'No worries!' here means…",["It's fine / you're welcome","Don't worry about money","I am worried"],0,"An informal reply to thanks."]],
rq:[["What should Ms Hassan do if she cannot attend?",["Call at least 24 hours before","Send a letter","Do nothing"],0,"'please call us at least 24 hours in advance'."],["What does 'a fee may apply' mean?",["She may have to pay","She will receive money","The visit is free"],0,"A charge is possible if she does not call."]],
g:["Countable and uncountable nouns; place and movement","Water, advice and information are uncountable: ✗ an information. Use a piece of / some. For directions: go along the road, turn left at the roundabout, go past the church, opposite the bank.",[["Could you give me some ___?",["information","informations","an information"],0,"Information is uncountable."]],[["Go ___ the bridge and turn left.","over|across","Movement across a place."],["It's ___ the bank, on the corner.","opposite|next to","A preposition of position."]]],
w:["Write a polite email to make an appointment or book a table: give the date, time and reason.","Dear Dr Patel, I would like to make an appointment next week, preferably on Thursday morning. I have had a sore throat for three days. Could you let me know if there are any times available? Thank you for your help. Kind regards, Amira Hassan"]},
C1:{o:"Use hedging and indirect requests, and understand implied meaning in service encounters.",
t:"Hi! Don't take the main road: it's chaos at this time. Come off at the roundabout, carry on past the old chapel and you can't miss us: the green door, just beyond the bakery. If you reach the petrol station, you've gone too far.",
lq:[["What is implied by 'Would Thursday at ten be all right?'",["A suggestion open to negotiation","A fixed order","A refusal"],0,"The question form invites agreement."],["Which feature makes the receptionist's turn polite?",["Hedging with 'I'm afraid' plus an alternative","Giving orders","Silence"],0,"She softens the refusal and offers a solution."]],
rq:[["What should you do if you reach the petrol station?",["Turn back","Continue","Park"],0,"'You've gone too far.'"],["What does 'you can't miss us' suggest?",["The place is easy to recognise","It is invisible","It is far"],0,"A common reassurance in directions."]],
g:["Hedging and indirect requests","Increase politeness with I was wondering if you could… / Would you mind if I…? / I'd be grateful if you'd… Past forms add distance and politeness.",[["Which is the most polite?",["Give me the menu.","Could you give me the menu?","I was wondering if I might see the menu."],2,"Hedged, past forms are the most tentative."]],[["Would you mind ___ the window?","opening","'Mind' is followed by -ing."]]],
w:["Write a short essay (introduction, body, conclusion): why does politeness matter in service encounters?","Politeness smooths everyday exchanges.\n\nWhereas blunt requests can offend, hedged ones preserve goodwill. Consequently, staff and customers cooperate more easily.\n\nNevertheless, excessive formality arguably wastes time."]}}},
6:{sp:"Group discussion: Should university students work while studying? Give your opinion with reasons, respond to others and reach a conclusion.",
v:[["In my opinion…","expression","في رأيي…","In my opinion, students should work part-time.","Introduces your own view."],["I see your point, but…","expression","أفهم وجهة نظرك، لكن…","I see your point, but it is expensive.","A polite way to disagree."],["That's a good point.","expression","هذه نقطة جيدة.","That's a good point; I hadn't thought of that.","Shows agreement or appreciation."],["I'd rather…","expression","أفضّل أن…","I'd rather stay in tonight.","Expresses a preference."],["I'm not particularly keen on…","expression","لست متحمسًا جدًّا لـ…","I'm not particularly keen on crowds.","A polite way to say you do not like something."],["Why don't we…?","expression","لمَ لا…؟","Why don't we go for a walk?","A suggestion."],["I'd love to, but…","expression","يسعدني ذلك، لكن…","I'd love to, but I have an exam.","A polite refusal."],["understatement","noun","التقليل من الأهمية (أسلوب بريطاني)","'Not bad' often means 'very good': that is understatement.","Saying that something is less important or good than it is."]],
m:[["I see your point, but…","…I'm not sure it's realistic."],["I'd love to, but…","…I'm busy on Friday."],["Why don't we…?","…meet after the seminar?"],["That's a good point.","I hadn't thought of that."]],
d:[["Ben","Are you coming to the quiz night on Friday?"],["Layla","I'd love to, but I've got an essay due on Monday."],["Ben","Fair enough. Why don't we go next week instead?"],["Layla","That would be great. By the way, do you think students should have part-time jobs?"],["Ben","In my opinion, yes. It's good experience, and the money helps."],["Layla","I see your point, but I'd rather focus on my degree. Work can be exhausting."],["Ben","That's a good point. Maybe a few hours a week is enough."],["Layla","Not bad, actually. I could manage that."]],
rp:[["Group discussion: Should university students work while studying?","Give your opinion with reasons, respond to others and reach a conclusion. For: money, experience, time management. Against: tiredness, lower grades, less free time.","Useful: In my opinion… · I see your point, but… · That's a good point. · On the other hand… · So, we agree that…","A: In my opinion, students should work part-time. It builds experience.\nB: I see your point, but studying is a full-time job.\nC: That's a good point. On the other hand, many students need the money.\nA: So, we agree that a few hours a week is reasonable."],["A classmate invites you to an event on a day when you are busy.","Decline politely and suggest another time.","Useful: Would you like to…? · I'd love to, but… · How about…?","A: Would you like to come to the quiz night on Friday?\nB: I'd love to, but I have an essay due. How about next week?\nA: Great, let's do that."]],
l:{
B1:{o:"Give opinions with reasons, agree and disagree politely, and accept or decline invitations.",
t:"In Britain, people queue patiently at bus stops and shops. It is rude to push in. People also say 'please', 'thank you' and 'sorry' very often, even when it is not their fault. These small words show respect and make daily life friendly.",
lq:[["Why can't Layla go on Friday?",["She has an essay due","She is ill","She dislikes quizzes"],0,"'I've got an essay due on Monday.'"],["Ben thinks students should work. (True or false?)",["True","False"],0,"'In my opinion, yes.'"],["When do they plan to go to the quiz night?",["Next week","Tonight","Never"],0,"'Why don't we go next week instead?'"]],
rq:[["What is rude in a queue?",["Pushing in","Waiting","Smiling"],0,"'It is rude to push in.'"],["People say 'sorry' only when it is their fault. (True or false?)",["True","False"],1,"They say it 'even when it is not their fault'."]],
g:["Verb patterns and would rather","Enjoy / suggest / mind + -ing (I enjoy cooking; She suggested going). Want / hope / would like + to-infinitive (I want to join). I'd rather + base verb (I'd rather stay in). Common mistake: ✗ I'd rather to stay.",[["I'd rather ___ at home tonight.",["stay","to stay","staying"],0,"'Would rather' is followed by the base verb."]],[["She suggested ___ for a walk. (go)","going","'Suggest' + -ing."],["I enjoy ___ new people. (meet)","meeting","'Enjoy' + -ing."]]],
w:["Write a short paragraph giving your opinion: should students work while studying? Give two reasons.","I think students should work part-time because they earn money and learn useful skills. First, a job helps to pay for books. Then it teaches you to manage time. However, too many hours can be tiring, so I would work only a few hours a week."]},
B2:{o:"Argue a point, concede and contrast ideas, and understand indirect British politeness.",
t:"British politeness is often indirect. 'That's an interesting idea' may mean 'I disagree', and 'I'll bear it in mind' can mean 'no'. Humour tends towards understatement: a storm might be described as 'a bit breezy'. Visitors who take such phrases literally may misjudge the speaker's real opinion.",
lq:[["How does Layla disagree?",["Politely, with 'I see your point, but…'","Rudely","She does not disagree"],0,"She softens the disagreement."],["What does 'Not bad, actually' show?",["Mild, understated approval","Dislike","Boredom"],0,"Understatement: 'not bad' means fairly good."],["Ben changes his position slightly. (True or false?)",["True","False"],0,"He accepts that 'a few hours a week' may be enough."]],
rq:[["What can 'That's an interesting idea' mean?",["I disagree","I love it","I'm hungry"],0,"It can be a polite way to disagree."],["What is understatement?",["Describing something as less serious than it is","Shouting","Lying"],0,"Like calling a storm 'a bit breezy'."]],
g:["Linking words for contrast and argument","Although / even though + clause; despite / in spite of + noun or -ing; however + new sentence; on the other hand. Common mistake: ✗ Despite of the cost.",[["___ the cost, many students work.",["Despite","Although","However"],0,"'Despite' is followed by a noun."]],[["___ it is tiring, work gives experience.","Although|Even though","'Although' introduces a clause."],["Work is useful. ___, it can be tiring.","However","'However' starts a contrasting sentence."]]],
w:["Write a paragraph giving arguments for and against students working while studying, with a conclusion.","Although part-time work gives students experience and money, it can reduce time for study. For example, a few hours at a café can build confidence. However, long shifts may affect grades. Therefore, I believe a limited number of hours is the best solution."]},
C1:{o:"Concede and counter-argue with nuance, and decode understatement and indirection.",
t:"The British preference for indirection is frequently misread as insincerity; it is better understood as a social lubricant that preserves face on both sides. Disagreement is cushioned by hedges ('with respect', 'I suppose'), while praise is deflected through self-deprecation. Mastery lies not in decoding each euphemism but in recognising the underlying norm: avoid imposing.",
lq:[["What is the effect of 'Fair enough' here?",["It accepts the refusal gracefully","It shows anger","It ignores her"],0,"It acknowledges Layla's reason without pressure."],["Which phrase shows the speakers reaching a compromise?",["Maybe a few hours a week is enough","Why don't we","By the way"],0,"Ben moves towards Layla's view."]],
rq:[["How does the writer view indirection?",["As a way of protecting both parties' dignity","As dishonesty","As rare"],0,"It 'preserves face on both sides'."],["What is 'the underlying norm'?",["Avoid imposing on others","Always be silent","Be blunt"],0,"The text states it directly."]],
g:["Concession and hedging in argument","Granted, … / Admittedly, … / While it may be true that …, … / That said, … Combine a concession with a counterpoint to sound balanced.",[["Which phrase concedes a point?",["Admittedly","Furthermore","Therefore"],0,"'Admittedly' concedes before a counterpoint."]],[["___, work builds experience; that said, it can harm grades.","Admittedly|Granted","A concession phrase."]]],
w:["Write a short essay (introduction, body, conclusion): should university students work while studying?","Working while studying is often presented as character-building.\n\nAdmittedly, it brings income and experience; that said, it can erode academic performance. Consequently, the question is how much, not whether.\n\nNevertheless, a moderate workload arguably offers the best of both worlds."]}}},
7:{sp:"If you could spend a day with a member of the Royal Family, who would you choose and why? Give two reasons and ask your partner a follow-up question.",
v:[["heir to the throne","noun","وليّ العهد","Prince William is the heir to the throne.","The person who will be the next king or queen."],["royal family","noun","العائلة المالكة","The royal family has several homes.","The monarch and their close relatives."],["Buckingham Palace","noun","قصر باكنغهام","Many official ceremonies take place at Buckingham Palace.","The monarch's official London residence."],["crown","noun","التاج","The crown is a symbol of the monarchy.","A circle of gold and jewels worn by a monarch."],["throne","noun","العرش","Charles came to the throne in 2022.","The ceremonial chair of a monarch; also the position."],["royal duties","noun","المهام الملكية","Royal duties include visiting charities.","Official work done by members of the royal family."],["state visit","noun","زيارة دولة","The King and Queen made a state visit to France in 2023.","An official visit to another country by a head of state."],["Changing of the Guard","noun","تبديل الحرس","Tourists love the Changing of the Guard.","A ceremony in which soldiers take over guard duty."]],
m:[["heir to the throne","the next king or queen"],["state visit","an official trip to another country"],["Changing of the Guard","a ceremony with soldiers at the palace"],["royal duties","official work done by royals"]],
d:[["Ella","Did you watch the Changing of the Guard when you visited London?"],["Tom","I did! It was outside Buckingham Palace. The soldiers looked amazing."],["Ella","Does the King actually live there?"],["Tom","He works there, and it's his official London home, but he has other residences too, like Windsor Castle."],["Ella","So who's next in line? Is it Prince William?"],["Tom","Yes, he's the heir to the throne. His eldest son, Prince George, comes after him."],["Ella","What do they actually do all day?"],["Tom","Loads of royal duties: meeting people, visiting charities and opening new buildings."],["Ella","Honestly, I'd love to spend a day with the Princess Royal. I hear she never stops working!"],["Tom","Ha! Fair enough."]],
rp:[["Speaking task: a day with a royal.","Say who you would choose, give two reasons and ask a follow-up question.","Useful: If I could…, I would choose… because… · I'd love to see… · What about you?","A: If I could spend a day with a royal, I'd choose the Princess Royal.\nB: Why?\nA: Because she works so hard, and I'd love to see her routine. What about you?\nB: I'd choose Prince William because he supports many charities."],["Describe the royal family.","Name three members and explain how they are related.","Useful: … is the King's … · … is the heir to the throne","A: Prince William is the King's eldest son and the heir to the throne.\nB: And Princess Charlotte is his daughter."]],
l:{
B1:{o:"Name the main royals, describe relationships and talk about royal life with the present simple and continuous.",
t:"A working royal's day often starts early. In the morning, the King may read official papers at Buckingham Palace. Later, he might meet visitors or open a hospital. Other members of the royal family visit schools, charities and local events across the country. The royal family has several homes, such as Windsor Castle and Balmoral in Scotland, but many official ceremonies take place at Buckingham Palace.",
lq:[["Where did Tom watch the Changing of the Guard?",["Outside Buckingham Palace","At Windsor Castle","In Edinburgh"],0,"'It was outside Buckingham Palace.'"],["Prince William is the heir to the throne. (True or false?)",["True","False"],0,"Tom says so."],["Which royal duty does Tom mention?",["Visiting charities","Running a bank","Teaching in schools"],0,"'visiting charities'."]],
rq:[["Where do many official ceremonies take place?",["Buckingham Palace","Balmoral","A school"],0,"The last sentence says so."],["Royals only work in London. (True or false?)",["True","False"],1,"They visit places across the country."]],
g:["Present simple, present continuous and possessives","Use the present simple for facts and routines (The King works at the palace). Use the present continuous for actions now (The guards are marching). Possessive adjectives (his, her, their) go before a noun; possessive pronouns (his, hers, theirs) stand alone: That palace is theirs.",[["The soldiers ___ outside the palace right now.",["are marching","march","marches"],0,"'Right now' needs the present continuous."]],[["Prince William is the King's son. He is ___ heir. (his / her)","his","Possessive adjective before a noun."],["That palace belongs to the royals. It is ___.","theirs","A possessive pronoun stands alone."]]],
w:["Write a short paragraph: a day with a member of the Royal Family.","I would like to spend a day with the Princess Royal because she works very hard. In the morning, I would watch her visit a charity. Then we would have lunch and talk about her work. I think it would be interesting and I would learn a lot."]},
B2:{o:"Describe people and royal traditions in detail and explain your opinions about the monarchy.",
t:"Royal life is a mixture of ceremony and routine. The King receives government papers and holds regular meetings, while other working royals carry out many engagements every year, from hospital visits to state occasions. Although the monarch is head of state, the role is largely symbolic: the royals do not make laws, but they represent the nation at home and abroad. In summer, parts of Buckingham Palace open to the public.",
lq:[["Does the King live only at Buckingham Palace?",["No, he has other residences","Yes","He lives in Edinburgh"],0,"Tom mentions Windsor Castle."],["What does 'Fair enough' show?",["Tom accepts Ella's choice","He is angry","He is bored"],0,"It means 'that is reasonable'."],["Who comes after Prince William in line to the throne?",["Prince George","Prince Harry","Princess Anne"],0,"'His eldest son, Prince George, comes after him.'"]],
rq:[["What is the monarch's role mainly?",["Largely symbolic","Making laws","Running the army"],0,"'largely symbolic'."],["What happens at Buckingham Palace in summer?",["Parts open to the public","It closes","Parliament meets there"],0,"The last sentence says so."]],
g:["Describing people and relationships","Use relative clauses and possessive 's: Prince William, who is the King's eldest son, visits charities. Use whose for possession: Prince William, whose wife is Catherine, ...",[["Prince William, ___ is the heir, visits many charities.",["who","which","whose"],0,"'Who' refers to a person."]],[["The Princess Royal is the King's ___. (sister)","sister","Family vocabulary."],["Prince William, ___ father is the King, is the heir.","whose","'Whose' shows possession."]]],
w:["Write a paragraph explaining who you would spend a day with and why.","If I could spend a day with a royal, I would choose Prince William. Firstly, he is the heir to the throne, so his role is important. Secondly, I would like to see his charity work. Therefore, I would ask him how he balances duty and family life."]},
C1:{o:"Discuss the monarchy critically, with cautious generalisations and nuanced opinions.",
t:"The enduring appeal of the monarchy rests on a paradox: an institution steeped in tradition must nonetheless appear relevant. Public engagements, charitable patronages and carefully staged ceremonies sustain visibility, yet critics question whether hereditary privilege has any place in a modern democracy. Opinion polls suggest that support is broad but far from uniform, varying notably by age.",

9:{sp:"Does representation matter in politics? Give your opinion, respond to others politely and reach a conclusion.",
info:"<div class=card><b>Key statistics (check the date and the scope)</b><ul><li><b>Official:</b> ONS Census 2021, England and Wales, Census Day 21 March 2021: about 3.9 million people (6.5% of residents) described themselves as Muslim, up from 2.7 million (4.9%) in 2011. The religion question was voluntary.</li><li><b>Estimate, not official:</b> media and community monitors reported about 25 of the 650 MPs elected in July 2024 as Muslim (estimates range from 24 to 25). Parliament keeps no official register of MPs' religious beliefs.</li></ul></div><div class=card><b>Sadiq Khan</b>: Mayor of London since 2016, re-elected for a third term in 2024. Born in Tooting, south London; his father was a bus driver. Studied law, became a human-rights solicitor, then MP for Tooting (2005 to 2016). The Mayor deals with transport, housing, policing and the environment in London.<br><span class=sm>Facts: first Muslim mayor of a major Western capital; London's first ethnic-minority mayor; first elected in 2016. Words: mayor, solicitor.</span></div><div class=card><b>Shabana Mahmood</b>: Home Secretary since September 2025, reappointed in July 2026. Born in Birmingham; studied law at Oxford and worked as a barrister; MP for Birmingham Ladywood since 2010; Justice Secretary before becoming Home Secretary. The Home Secretary leads the Home Office: policing, immigration and border security.<br><span class=sm>Facts: Oxford-educated barrister; MP since 2010; one of the most senior ministers. Words: barrister, minister.</span></div><div class=card><b>Naz Shah</b>: MP for Bradford West since 2015. Born in Bradford; won the seat from George Galloway in 2015; held opposition front-bench roles from 2018 to 2023, including community cohesion and crime reduction.<br><span class=sm>Facts: born in Bradford; first elected in 2015; shadow minister 2018 to 2023. Words: shadow minister, constituency.</span></div><div class=card sm>These three politicians belong to the Labour Party, but Muslims in Britain vote for many parties, including the Conservatives, and for independents, and hold many different views. Facts checked on 8 November 2026 against ONS, GOV.UK, London.gov.uk and press reports.</div>",
v:[["political representation","noun","التمثيل السياسي","Political representation means that people can see themselves in government.","Having people in politics who speak for different groups."],["community","noun","مجتمع محلي","Our community organises a monthly clean-up.","A group of people who live in an area or share something."],["diversity","noun","التنوع","The council values diversity.","A mix of people from different backgrounds."],["background","noun","الخلفية","She comes from a working-class background.","Your family, education and experience."],["Member of Parliament (MP)","noun","عضو في البرلمان","Our MP visited the school.","A person elected to the House of Commons."],["mayor","noun","عمدة","The mayor opened the new library.","The elected leader of a city."],["Home Secretary","noun","وزير الداخلية","The Home Secretary is responsible for policing and immigration.","The minister in charge of the Home Office."],["public service","noun","الخدمة العامة","He chose a career in public service.","Work that helps the public, often for the government."],["constituency","noun","دائرة انتخابية","She represents a constituency in Bradford.","The area an MP represents."],["election","noun","انتخابات","The election was very close.","A vote to choose representatives."],["leadership","noun","القيادة","Good leadership needs listening.","The ability to guide others."],["equal opportunities","noun","تكافؤ الفرص","Schools should offer equal opportunities.","Fair chances for everyone."],["public office","noun","منصب عام","She holds public office.","An official position in government."],["stand for election","verb phrase","يترشّح للانتخابات","He decided to stand for election.","To be a candidate in an election."],["represent a community","verb phrase","يمثّل مجتمعًا","MPs represent their communities in Parliament.","To speak and act for the people of an area or group."]],

d:[["Hana","Welcome back to Campus Voices. Today: representation in British politics."],["Dan","Right. I read that the 2021 census recorded about 3.9 million Muslims in England and Wales, around 6.5 per cent of the population."],["Hana","And that includes some well-known public figures. Take Sadiq Khan: he's been Mayor of London since 2016."],["Dan","His dad was a bus driver, wasn't he? He trained as a solicitor before going into politics."],["Hana","Exactly. And Shabana Mahmood is the Home Secretary. She's in charge of things like policing and immigration."],["Dan","It's worth saying, though, that Muslims don't all vote the same way. Communities are diverse, and so are their views."],["Hana","Good point. Some MPs are Labour, some Conservative, some independent."],["Dan","So does representation matter? I'd say yes, because it shows young people that public office is open to them."],["Hana","I see your point, but a good representative should listen to everyone, whatever their background."],["Dan","Fair enough. Both things matter."]],
rp:[["Discussion: Does representation matter in politics?","Give your opinion with reasons, listen and respond politely. Remember that Muslim communities hold many different views. Think about: Why is diversity in public life important? What makes a good representative? Can you name similar figures in your country?","Useful: In my opinion… · I see your point, but… · That's a good point. · A good representative should… · In my country…","A: In my opinion, representation matters because it shows young people that politics is open to them.\nB: I see your point, but a good representative should listen to everyone.\nA: That's a good point. Maybe both matter.\nB: In my country, we also have women ministers who inspire many girls."],["Compare with your country.","Name a public figure in your country and say what they do.","Useful: In my country… · … is the Minister of… · This is similar to…","A: In my country, the mayor of my city is responsible for transport.\nB: That's similar to the Mayor of London."]],

w:["Write a short profile (60–80 words) of one of the three politicians: background, role, responsibilities and why he or she is interesting.","Sadiq Khan is the Mayor of London. He was born in Tooting, in south London, and his father was a bus driver. He studied law at university and became a solicitor. Later he became an MP and, in 2016, he was elected Mayor of London. He is responsible for transport, housing and policing in the city. I find him interesting because he started from a normal family.",[60,80]]},

w:["Write a short profile (100–120 words) of one of the three politicians: background, political role, responsibilities and why he or she is interesting.","Shabana Mahmood is a British politician who was born in Birmingham. She studied law at Oxford and worked as a barrister before becoming the MP for Birmingham Ladywood in 2010. She has held several important posts: she was Justice Secretary and, since September 2025, she has been Home Secretary. In this role, she is responsible for policing, immigration and border security. I find her interesting because she has risen to one of the most senior jobs in government. Although people disagree about her policies, her career shows how public service can offer opportunities to talented people from many backgrounds.",[100,120]]},
C1:{o:"Analyse representation critically, distinguishing descriptive from substantive representation and avoiding generalisations.",
t:"Descriptive representation, the idea that legislatures should broadly mirror the society they serve, is often contrasted with substantive representation, whereby representatives advance their constituents' interests irrespective of shared identity. Empirical evidence is mixed: visibility can inspire participation, yet a representative's effectiveness ultimately depends on policy choices and accountability, not demographics alone. Equally, assuming uniform preferences among any religious group is a category error.",

function quiz(el,items,cb){

 const next=()=>{
  if(i>=ws.length){el.innerHTML='<div class=card><b>Score: '+s+'/'+ws.length+'</b></div>';const b=document.createElement('button');b.className='btn pri';b.textContent='Practise again';b.onclick=()=>recall(el,ws,cb);el.append(b);if(cb)cb();return}
  const w=ws[i];el.innerHTML='<div class=card><div>Say it in English:</div><div class=ar style="font-size:1.5rem">'+w[2]+'</div><input class=ri id=ri aria-label="English answer" autocomplete=off><p class=fb id=rf aria-live=polite></p></div>';
  const inp=$('#ri'),f=$('#rf'),b=document.createElement('button');b.className='btn pri';b.textContent='Check';
  let chk=false;b.onclick=()=>{if(chk){i++;next();return}chk=true;const ok=norm(inp.value)===norm(w[0]);if(ok)s++;
   f.innerHTML=(ok?'<span class=good>✓ Correct.</span> ':'<span class=bad>✗ Not quite.</span> Answer: <b>'+w[0]+'</b>. ')+'<i>'+w[3]+'</i>';b.textContent=i+1<ws.length?'Next word':'See score'};
  inp.onkeydown=e=>{if(e.key==='Enter')b.click()};el.firstChild.append(b);inp.focus()};
 next()}

function wordRows(ws){return ws.map(w=>'<div class=w><b>'+w[0]+'</b> <span class=sm>('+w[1]+')</span> <button class=btn style="padding:0 10px" onclick="say(\''+w[0].replace(/'/g,"\\'")+'\',.8)" aria-label="Listen to '+w[0]+'">🔊</button><div class=ar>'+w[2]+'</div>'+(w[4]?'<div class=sm><i>'+w[4]+'</i></div>':'')+'<div class=sm>'+w[3]+'</div></div>').join('')}

function play(d,r){try{speechSynthesis.cancel();const vs=speechSynthesis.getVoices().filter(v=>v.lang==='en-GB'),names=[...new Set(d.map(y=>y[0]))];d.forEach(x=>{const u=new SpeechSynthesisUtterance(x[1]),k=names.indexOf(x[0]);u.lang='en-GB';u.rate=r||.9;u.pitch=k%2?1.3:.8;if(vs.length)u.voice=vs[k%vs.length];speechSynthesis.speak(u)})}catch(e){}}
function gap(el,items,cb){el.innerHTML='';const dn=[],sc=document.createElement('p'),up=()=>sc.innerHTML='<b>Score: '+dn.filter(x=>x===1).length+'/'+items.length+'</b>';up();
 items.forEach((it,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=it[0].replace('___','<input class=ri style="width:9em;display:inline-block;padding:4px 10px" aria-label="Missing word" autocomplete=off>')+' ';
  const b=document.createElement('button'),f=document.createElement('div');b.className='btn';b.textContent='Check';f.className='fb';f.setAttribute('aria-live','polite');
  b.onclick=()=>{const ok=it[1].split('|').map(norm).includes(norm(d.querySelector('input').value));dn[i]=ok?1:0;f.innerHTML=(ok?'<span class=good>✓ Correct.</span> ':'<span class=bad>✗ Not quite.</span> Answer: <b>'+it[1].split('|')[0]+'</b>. ')+it[2];up();if(dn.filter(x=>x!==undefined).length===items.length&&cb)cb()};
  d.append(b,f);el.append(d)});el.append(sc)}
function match(el,ps){const o=ps.map(x=>x[1]).sort(()=>Math.random()-.5);
 el.innerHTML='<div class=card>'+ps.map(x=>'<div class=w><b>'+x[0]+'</b><br><select aria-label="Match">'+'<option value="">Choose…</option>'+o.map(y=>'<option>'+y+'</option>').join('')+'</select> <span class=fb></span></div>').join('')+'<button class="btn pri">Check</button> <b class=sc></b></div>';
 el.querySelector('button').onclick=()=>{let n=0;el.querySelectorAll('select').forEach((x,i)=>{const ok=x.value===ps[i][1];n+=ok;x.nextElementSibling.innerHTML=ok?'<span class=good>✓</span>':'<span class=bad>✗ '+ps[i][1]+'</span>'});el.querySelector('.sc').textContent='Score: '+n+'/'+ps.length}}
function home(){
 app.innerHTML='<div class=card><b>Course plan <span class=ar>خطة المقرر</span></b><br>9 themes × 3 lessons = 27 lessons (27 h) + 8 h for speaking workshops, revision, projects and the final assessment = 35 h.</div><input type=search id=s placeholder="🔎 Search lessons or words… / ابحث" aria-label="Search"><div class=lv role=group aria-label="Level">'+LV.map(l=>'<button data-l='+l+' class="'+(l===lvl()?'on':'')+'">'+l+'</button>').join('')+'</div><div id=sr></div><div id=path></div>';
 const draw=q=>{q=q.toLowerCase();let h='';
  TH.forEach((t,i)=>{const th=[1,2,3].map(k=>i*3+k),ls=th.filter(n=>!q||[T[n-1][0].toLowerCase(),T[n-1][1],t[0].toLowerCase(),t[1]].some(x=>x.includes(q)));if(!ls.length)return;
   const bt=th.filter(n=>L[n]),avg=bt.length?Math.round(bt.reduce((a,n)=>a+pct(n,lvl()),0)/bt.length):0;
   h+='<section class=unit><div class=ring style="--p:'+avg+'"><b>'+(i+1)+'</b></div><div><div class=sm>Theme '+(i+1)+' · <span class=ar>الموضوع '+(i+1)+'</span> · '+lvl()+'</div><h2>'+t[0]+'</h2><div class=ar>'+t[1]+'</div>'+
   ls.map(n=>L[n]?'<a class=pill href="#L/'+n+'/prep"><span>📘 Lesson '+TN(n)+': '+T[n-1][0]+'<br><small class=ar style="color:#fff">'+T[n-1][1]+'</small></span><span>'+pct(n,lvl())+'% ›</span></a>':'<div class=soon>Lesson '+TN(n)+': '+T[n-1][0]+' · Coming soon · <span class=ar>قريبًا</span></div>').join('')+'</div></section>'});
  $('#path').innerHTML=h||'<p>No lesson found.</p>';
  const m=q?all().filter(w=>(w[0]+w[2]+w[3]).toLowerCase().includes(q)):[];
  $('#sr').innerHTML=m.length?'<div class=card><b>Words found ('+m.length+')</b>'+wordRows(m)+'</div>':''};
 $('#s').oninput=e=>draw(e.target.value.trim());
 app.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{P.lv=b.dataset.l;save();home()});draw('')}

const TB=[['prep','Vocabulary','Before class'],['listen','Listening'],['read','Reading'],['grammar','Grammar'],['speak','Speaking','Speaking area'],['write','Writing','After class'],['rev','Revision']];
function lesson(n,tab){
 if(!L[n]){location.hash='';return}
 const lv=lvl(),D=L[n].l[lv],M=MEDIA[n]||{};window.T0=D.t;
 let tb='';TB.forEach(t=>{if(t[2])tb+='<div class=grp>'+t[2]+'</div><div class=tabs>';tb+='<a href="#L/'+n+'/'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</a>';});
 tb=tb.replace(/<div class=grp>/g,(m,o)=>o?'</div>'+m:m)+'</div>';
 app.innerHTML='<p><a href="#">‹ All lessons <span class=ar>الدروس</span></a></p><h2>Lesson '+n+': '+T[n-1][0]+'</h2><div class=ar>'+T[n-1][1]+'</div><div class=lv>'+LV.map(l=>'<button data-l='+l+' class="'+(l===lv?'on':'')+'">'+l+'</button>').join('')+'</div>'+tb+'<div id=pane></div>';
 app.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{P.lv=b.dataset.l;save();lesson(n,tab)});
 const p=$('#pane');let h='';
 if(tab==='prep'){h='<div class=card><h3>Learning objective</h3>'+D.o+'</div><h3>Vocabulary bank</h3><div class=card><label><input type=checkbox id=bl> Hide Arabic (tap a word to reveal it)</label><div id=wl>'+wordRows(L[n].v)+'</div></div>'+(L[n].m?'<h3>Matching</h3><div id=mt></div>':'')+'<h3>Arabic → English recall</h3><div id=rc></div>';p.innerHTML=h;if(L[n].m)match($('#mt'),L[n].m);
  $('#bl').onchange=e=>$('#wl').classList.toggle('bl',e.target.checked);$('#wl').onclick=e=>{const a=e.target.closest('.ar');if(a)a.style.filter='none'};
  recall($('#rc'),L[n].v,()=>done(n,'prep'))}
 else if(tab==='listen'&&L[n].d){p.innerHTML='<p>Listen to the dialogue as many times as you like, then answer. The transcript appears when you finish.</p><button class="btn pri" onclick="play(L['+n+'].d,.9)">▶ Play dialogue (British voice)</button> <button class=btn onclick="play(L['+n+'].d,.7)">🐢 Slower</button><p class=sm>Voices are generated by your browser and vary by device. A teacher recording appears below when one is added.</p>'+(M.audio?'<audio controls src="'+M.audio+'"></audio>':'')+(M.video?'<video controls src="'+M.video+'"></video>':'')+'<div id=qz></div><div class=card id=tr hidden><b>Transcript</b>'+L[n].d.map(x=>'<p style="margin:.3em 0"><b>'+x[0]+':</b> '+x[1]+'</p>').join('')+'</div>'+(M.qa?'<h3>Teacher questions</h3><div id=qm></div>':'');quiz($('#qz'),D.lq,()=>{$('#tr').hidden=false;done(n,'listen')});if(M.qa)quiz($('#qm'),M.qa)}
 else if(tab==='listen'){h='<p>Listen as many times as you like, then answer.</p><button class="btn pri" onclick="say(T0,.9)">▶ Play (British voice)</button> <button class=btn onclick="say(T0,.7)">🐢 Slower</button> <button class=btn onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Show / hide script</button><p class=card hidden>'+D.t+'</p>'+
  (M.audio?'<h3>Teacher audio</h3><audio controls src="'+M.audio+'"></audio>':'')+(M.video?'<h3>Teacher video</h3><video controls src="'+M.video+'"></video>':'')+'<div id=qz></div>'+(M.qa?'<h3>Audio / video questions</h3><div id=qm></div>':'');p.innerHTML=h;
  quiz($('#qz'),[D.q[0]],()=>done(n,'listen'));if(M.qa)quiz($('#qm'),M.qa)}
 else if(tab==='read'){p.innerHTML=(L[n].info||'')+'<div class=card style="font-size:1.1rem;line-height:1.7">'+D.t+'</div><div id=qz></div>';quiz($('#qz'),D.rq||[D.q[1]],()=>done(n,'read'))}
 else if(tab==='grammar'){p.innerHTML='<div class=card><h3>'+D.g[0]+'</h3><p>'+D.g[1]+'</p><p class=sm><b>Why here?</b> You need it to complete this lesson’s speaking task.</p></div><div id=qz></div>';quiz($('#qz'),D.g[2],()=>done(n,'grammar'));if(D.g[3]){p.insertAdjacentHTML('beforeend','<h3>Gap-fill</h3><div id=gf></div>');gap($('#gf'),D.g[3])}}
 else if(tab==='speak'){const cr=['Fluency: I spoke without long pauses','Pronunciation: my vowels and stress were clear','Vocabulary: I used words from this lesson','Grammar: I used the target structure','Task: I answered every part of the prompt'];
  p.innerHTML='<div class=card><h3>Your task</h3><p>'+L[n].sp+'</p><p class=sm>Level '+lv+': speak for '+({B1:'45 seconds',B2:'1 minute',C1:'90 seconds'}[lv])+'.</p></div><ol><li>Read the task and plan your ideas.</li><li>Listen to the teacher’s model.</li><li><b>Record yourself on your own phone</b> (nothing is uploaded here).</li><li>Listen to your recording and compare it with the model.</li></ol>'+
  (M.model?'<audio controls src="'+M.model+'"></audio>':'<div class=soon>Teacher’s model audio will appear here.</div>')+'<div class=card><h3>Self-assessment</h3>'+cr.map(c=>'<label style="display:block"><input type=checkbox> '+c+'</label>').join('')+'</div>';
  if(L[n].rp)p.insertAdjacentHTML('afterbegin','<h3>Role-plays</h3>'+L[n].rp.map((r,i)=>'<div class=card><b>Situation '+(i+1)+':</b> '+r[0]+'<br><b>Goal:</b> '+r[1]+'<br><span class=sm>'+r[2]+'</span><details><summary>Model answer</summary><p style="white-space:pre-line">'+r[3]+'</p></details></div>').join(''));
  p.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{if(p.querySelectorAll('input:checked').length>=3)done(n,'speak')})}
 else if(tab==='write'){const lim=D.w[2]||LIM[lv];p.innerHTML='<div class=card><h3>Task</h3><p>'+D.w[0]+'</p><p class=sm><b>Words:</b> '+lim[0]+'–'+lim[1]+' · <b>Audience:</b> your teacher and classmates · <b>Purpose:</b> to show you can use this lesson’s language.</p><p class=sm><b>Useful linking words:</b> '+LK[lv].join(', ')+'</p></div><textarea id=tx aria-label="Your writing"></textarea><p class=sm id=wc>0 words</p><button class="btn pri" id=ck>Check my writing</button> <button class=btn id=md>Show model answer</button><div id=res></div><div class=card id=mo hidden><b>Model answer (shortened example)</b><p style="white-space:pre-line">'+D.w[1]+'</p></div><div class=card><h3>Assessment criteria and self-correction</h3><p class=sm>Task achievement · Organisation · Range of language · Accuracy · British spelling.</p>'+['I answered the task','I checked my verbs and tenses','I used linking words','I used British spelling','I reread it aloud'].map(c=>'<label style="display:block"><input type=checkbox> '+c+'</label>').join('')+'</div>';
  const tx=$('#tx');tx.oninput=()=>$('#wc').textContent=(tx.value.trim()?tx.value.trim().split(/\s+/).length:0)+' words';
  $('#md').onclick=()=>$('#mo').hidden=!$('#mo').hidden;
  $('#ck').onclick=()=>{const t=tx.value,low=t.toLowerCase(),w=t.trim()?t.trim().split(/\s+/).length:0,r=[];
   r.push([w>=lim[0]&&w<=lim[1],'Word count: '+w+' (target '+lim[0]+'–'+lim[1]+')']);
   const lk=LK[lv].filter(x=>low.includes(x)),need=lv==='C1'?3:2;r.push([lk.length>=need,'Linking words: '+(lk.join(', ')||'none')+' (aim for '+need+'+)']);
   const am=low.match(/\b(color|favorite|center|organize|neighbor|program|realize)\w*/g)||[];r.push([!am.length,am.length?'American spelling: '+am.join(', ')+' → use British forms (colour, favourite, centre…)':'British spelling: no problems found']);
   r.push([/^[A-Z]/.test(t.trim())&&/[.!?]$/.test(t.trim()),'Starts with a capital letter and ends with punctuation']);
   const er=/\b(i am agree|peoples|he don't|she don't|more better)\b/i.test(t);r.push([!er,er?'Common error found (e.g. “I am agree”, “peoples”)':'None of the common errors on our list were found']);
   if(lv==='C1')r.push([t.split(/\n\s*\n/).filter(x=>x.trim()).length>=3,'Essay structure: introduction, body and conclusion in separate paragraphs']);
   $('#res').innerHTML='<div class=card><b>Automatic feedback</b><ul>'+r.map(x=>'<li class='+(x[0]?'good':'bad')+'>'+(x[0]?'✓ ':'✗ ')+x[1]+'</li>').join('')+'</ul><p class=sm>This tool checks form, not ideas. Compare with the model, then ask your teacher.</p></div>';
   if(w>=lim[0])done(n,'write')}}
 else{let ws=[];for(let k=1;k<=n;k++)if(L[k])ws=ws.concat(L[k].v);p.innerHTML='<p>Cumulative revision: words from this and earlier lessons return here.</p><div id=rc></div>';recall($('#rc'),ws)}
 window.scrollTo(0,0)}

function vocab(){app.innerHTML='<h2>Vocabulary bank <span class=ar>قاموس المفردات</span></h2><input type=search id=s placeholder="Search English or Arabic… / ابحث" aria-label="Search words"><label><input type=checkbox id=bl> Hide Arabic (tap a word to reveal it)</label><div class=card id=wl></div>';
 const d=q=>{const m=all().filter(w=>(w[0]+w[2]+w[3]).toLowerCase().includes(q.toLowerCase()));$('#wl').innerHTML=m.length?wordRows(m):'No word found.'};
 $('#s').oninput=e=>d(e.target.value.trim());$('#bl').onchange=e=>$('#wl').classList.toggle('bl',e.target.checked);$('#wl').onclick=e=>{const a=e.target.closest('.ar');if(a)a.style.filter='none'};d('')}
function rev(){app.innerHTML='<h2>Revision <span class=ar>المراجعة</span></h2><p>Words from every lesson come back here. Type the English for each Arabic prompt.</p><div id=rc></div>';recall($('#rc'),all())}
function prog(){let h='<h2>My progress <span class=ar>تقدّمي</span></h2><div class=card>';
 Object.keys(L).forEach(n=>h+='<p><b>Lesson '+TN(+n)+'</b> – '+T[n-1][0]+'<br>'+LV.map(l=>l+': '+pct(n,l)+'%').join(' · ')+'</p>');
 app.innerHTML=h+'</div><button class=btn id=rs>Reset progress</button>';$('#rs').onclick=()=>{if(confirm('Delete all progress on this device?')){P={};save();prog()}}}
function route(){const h=location.hash.slice(1).split('/');
 if(h[0]==='L')lesson(+h[1],h[2]||'prep');else if(h[0]==='vocab')vocab();else if(h[0]==='rev')rev();else if(h[0]==='prog')prog();else home()}
addEventListener('hashchange',route);route();
</script></body></html>
