const pct=(n,l)=>Math.round(STG.filter(s=>P[n+l+s]).length/STG.length*100);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim();
const mix=n=>{const sh=a=>[...a].sort(()=>Math.random()-.5),e=[];for(let k=1;k<n;k++)if(L[k])e.push(...L[k].v);return sh(L[n].v).slice(0,8).concat(sh(e).slice(0,4))};
const all=()=>{let a=[];Object.keys(L).forEach(n=>L[n].v.forEach(w=>a.push(w)));return a};
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.9;const v=speechSynthesis.getVoices().find(v=>v.lang==='en-GB');if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

function quiz(el,items,cb){
 const st=[];el.innerHTML='';
 const sc=document.createElement('p');sc.innerHTML='<b>Score: 0/'+items.length+'</b>';
 items.forEach((it,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+(i+1)+'. '+it[0]+'</b>';
  const fb=document.createElement('div');fb.className='fb';fb.setAttribute('aria-live','polite');
  it[1].forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;
   b.onclick=()=>{const ok=j===it[2];d.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');
    fb.innerHTML=(ok?'<span class=good>✓ Correct.</span> ':'<span class=bad>✗ Not quite.</span> Correct answer: <b>'+it[1][it[2]]+'</b>. ')+it[3];
    st[i]=ok?1:0;const n=st.reduce((a,x)=>a+x,0);sc.innerHTML='<b>Score: '+n+'/'+items.length+'</b>';
    if(st.filter(x=>x!==undefined).length===items.length&&cb)cb()};d.append(b)});
  d.append(fb);el.append(d)});
 el.append(sc);const r=document.createElement('button');r.className='btn';r.textContent='Repeat this activity';r.onclick=()=>quiz(el,items,cb);el.append(r)}

function recall(el,ws,cb){
 ws=[...ws].sort(()=>Math.random()-.5).slice(0,12);let i=0,s=0;
 const next=()=>{
  if(i>=ws.length){el.innerHTML='<div class=card><b>Score: '+s+'/'+ws.length+'</b></div>';const b=document.createElement('button');b.className='btn pri';b.textContent='Practise again';b.onclick=()=>recall(el,ws,cb);el.append(b);if(cb)cb();return}
  const w=ws[i];el.innerHTML='<div class=card><div>Say it in English:</div><div class=ar style="font-size:1.5rem">'+w[2]+'</div><input class=ri id=ri aria-label="English answer" autocomplete=off><p class=fb id=rf aria-live=polite></p></div>';
  const inp=$('#ri'),f=$('#rf'),b=document.createElement('button');b.className='btn pri';b.textContent='Check';
  let chk=false;b.onclick=()=>{if(chk){i++;next();return}chk=true;const ok=norm(inp.value)===norm(w[0]);if(ok)s++;
   f.innerHTML=(ok?'<span class=good>✓ Correct.</span> ':'<span class=bad>✗ Not quite.</span> Answer: <b>'+w[0]+'</b>. ')+'<i>'+w[3]+'</i>';b.textContent=i+1<ws.length?'Next word':'See score'};
  inp.onkeydown=e=>{if(e.key==='Enter')b.click()};el.firstChild.append(b);inp.focus()};
 next()}

function wordRows(ws){return ws.map(w=>'<div class=w><b>'+w[0]+'</b> <span class=sm>('+w[1]+')</span> <button class=btn style="padding:0 10px" onclick="say(\''+w[0].replace(/'/g,"\\'")+'\',.8)" aria-label="Listen to '+w[0]+'">🔊</button><div class=ar>'+w[2]+'</div>'+(w[4]?'<div class=sm><i>'+w[4]+'</i></div>':'')+'<div class=sm>'+w[3]+'</div></div>').join('')}

function play(d,r){try{speechSynthesis.cancel();const vs=speechSynthesis.getVoices().filter(v=>v.lang==='en-GB'),names=[...new Set(d.map(y=>y[0]))];d.forEach(x=>{const u=new SpeechSynthesisUtterance(x[1]),k=names.indexOf(x[0]);u.lang='en-GB';u.rate=r||.9;u.pitch=k%2?1.3:.8;if(vs.length)u.voice=vs[k%vs.length];speechSynthesis.speak(u)})}catch(e){}}
function gap(el,items,cb){el.innerHTML='';const dn=[],sc=document.createElement('p'),up=()=>sc.innerHTML='<b>Score: '+dn.filter(x=>x===1).length+'/'+items.length+'</b>';up();
 items.forEach((it,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=it[0].replace('___','<input class=ri style="width:9em;display:inline-block;padding:4px 10px" aria-label="Missing word" autocomplete=off>')+' ';
  const b=document.createElement('button'),f=document.createElement('div');b.className='btn';b.textContent='Check';f.className='fb';f.setAttribute('aria-live','polite');
  b.onclick=()=>{const ok=it[1].split('|').map(norm).includes(norm(d.querySelector('input').value));dn[i]=ok?1:0;f.innerHTML=(ok?'<span class=good>✓ Correct.</span> ':'<span class=bad>✗ Not quite.</span> Answer: <b>'+it[1].split('|')[0]+'</b>. ')+it[2];up();if(dn.filter(x=>x!==undefined).length===items.length&&cb)cb()};
  d.append(b,f);el.append(d)});el.append(sc)}
function match(el,ps){const o=ps.map(x=>x[1]).sort(()=>Math.random()-.5);
 el.innerHTML='<div class=card>'+ps.map(x=>'<div class=w><b>'+x[0]+'</b><br><select aria-label="Match">'+'<option value="">Choose…</option>'+o.map(y=>'<option>'+y+'</option>').join('')+'</select> <span class=fb></span></div>').join('')+'<button class="btn pri">Check</button> <b class=sc></b></div>';
 el.querySelector('button').onclick=()=>{let n=0;el.querySelectorAll('select').forEach((x,i)=>{const ok=x.value===ps[i][1];n+=ok;x.nextElementSibling.innerHTML=ok?'<span class=good>✓</span>':'<span class=bad>✗ '+ps[i][1]+'</span>'});el.querySelector('.sc').textContent='Score: '+n+'/'+ps.length}}
function home(){
 app.innerHTML='<div class=card><b>Course plan <span class=ar>خطة المقرر</span></b><br>7 sessions × 3 lessons = 21 lessons (21 h). Part 1: Everyday English (Sessions 1–4) · Part 2: Preparing for University in the UK (Sessions 5–7). One continuous progression from A2 to B2.</div><input type=search id=s placeholder="🔎 Search lessons or words… / ابحث" aria-label="Search"><div id=sr></div><div id=path></div>';
 const draw=q=>{q=q.toLowerCase();let h='';
  TH.forEach((t,i)=>{const th=[1,2,3].map(k=>i*3+k),ls=th.filter(n=>!q||[T[n-1][0].toLowerCase(),T[n-1][1],t[0].toLowerCase(),t[1]].some(x=>x.includes(q)));if(!ls.length)return;
   const bt=th.filter(n=>L[n]),avg=bt.length?Math.round(bt.reduce((a,n)=>a+pct(n,lvl()),0)/bt.length):0;
   h+='<section class=unit><div class=ring style="--p:'+avg+'"><b>'+(i+1)+'</b></div><div><div class=sm>Session '+(i+1)+' · <span class=ar>الجلسة '+(i+1)+'</span> · '+LVL[i]+'</div><h2>'+t[0]+'</h2><div class=ar>'+t[1]+'</div>'+
   ls.map(n=>L[n]?'<a class=pill href="#L/'+n+'/prep"><span>📘 Lesson '+TN(n)+': '+T[n-1][0]+'<br><small class=ar style="color:#fff">'+T[n-1][1]+'</small></span><span>'+pct(n,lvl())+'% ›</span></a>':'<div class=soon>Lesson '+TN(n)+': '+T[n-1][0]+' · Coming soon · <span class=ar>قريبًا</span></div>').join('')+'</div></section>'});
  $('#path').innerHTML=h||'<p>No lesson found.</p>';
  const m=q?all().filter(w=>(w[0]+w[2]+w[3]).toLowerCase().includes(q)):[];
  $('#sr').innerHTML=m.length?'<div class=card><b>Words found ('+m.length+')</b>'+wordRows(m)+'</div>':''};
 $('#s').oninput=e=>draw(e.target.value.trim());
 draw('')}

const TB=[['prep','Vocabulary','Before class'],['listen','Listening'],['read','Reading'],['grammar','Grammar'],['speak','Speaking','Speaking area'],['write','Writing','After class'],['rev','Revision']];
function lesson(n,tab){
 if(!L[n]){location.hash='';return}
 const D=L[n].l,M=MEDIA[n]||{},SL=LVL[Math.ceil(n/3)-1];window.T0=D.t;
 let tb='';TB.forEach(t=>{if(t[2])tb+='<div class=grp>'+t[2]+'</div><div class=tabs>';tb+='<a href="#L/'+n+'/'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</a>';});
 tb=tb.replace(/<div class=grp>/g,(m,o)=>o?'</div>'+m:m)+'</div>';
 app.innerHTML='<p><a href="#">‹ All lessons <span class=ar>الدروس</span></a></p><h2>Lesson '+n+': '+T[n-1][0]+'</h2><div class=ar>'+T[n-1][1]+'</div><p class=sm>Session '+Math.ceil(n/3)+' · Target level: <b>'+SL+'</b></p>'+tb+'<div id=pane></div>';
 const p=$('#pane');let h='';
 if(tab==='prep'){h='<div class=card><h3>Learning objective</h3>'+D.o+'</div><h3>Vocabulary bank</h3><div class=card><label><input type=checkbox id=bl> Hide Arabic (tap a word to reveal it)</label><div id=wl>'+wordRows(L[n].v)+'</div></div>'+(L[n].m?'<h3>Matching</h3><div id=mt></div>':'')+'<h3>Arabic → English Recall</h3><div id=rc></div>';p.innerHTML=h;if(L[n].m)match($('#mt'),L[n].m);
  $('#bl').onchange=e=>$('#wl').classList.toggle('bl',e.target.checked);$('#wl').onclick=e=>{const a=e.target.closest('.ar');if(a)a.style.filter='none'};
  recall($('#rc'),mix(n),()=>done(n,'prep'))}
 else if(tab==='listen'&&L[n].d){p.innerHTML='<p>Listen to the dialogue as many times as you like, then answer. The transcript appears when you finish.</p><button class="btn pri" onclick="play(L['+n+'].d,.9)">▶ Play dialogue (British voice)</button> <button class=btn onclick="play(L['+n+'].d,.7)">🐢 Slower</button><p class=sm>Voices are generated by your browser and vary by device. A teacher recording appears below when one is added.</p>'+(M.audio?'<audio controls src="'+M.audio+'"></audio>':'')+(M.video?'<video controls src="'+M.video+'"></video>':'')+'<div id=qz></div><div class=card id=tr hidden><b>Transcript</b>'+L[n].d.map(x=>'<p style="margin:.3em 0"><b>'+x[0]+':</b> '+x[1]+'</p>').join('')+'</div>'+(M.qa?'<h3>Teacher questions</h3><div id=qm></div>':'');quiz($('#qz'),D.lq,()=>{$('#tr').hidden=false;done(n,'listen')});if(M.qa)quiz($('#qm'),M.qa)}
 else if(tab==='listen'){h='<p>Listen as many times as you like, then answer.</p><button class="btn pri" onclick="say(T0,.9)">▶ Play (British voice)</button> <button class=btn onclick="say(T0,.7)">🐢 Slower</button> <button class=btn onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Show / hide script</button><p class=card hidden>'+D.t+'</p>'+
  (M.audio?'<h3>Teacher audio</h3><audio controls src="'+M.audio+'"></audio>':'')+(M.video?'<h3>Teacher video</h3><video controls src="'+M.video+'"></video>':'')+'<div id=qz></div>'+(M.qa?'<h3>Audio / video questions</h3><div id=qm></div>':'');p.innerHTML=h;
  quiz($('#qz'),[D.q[0]],()=>done(n,'listen'));if(M.qa)quiz($('#qm'),M.qa)}
 else if(tab==='read'){p.innerHTML=(L[n].info||'')+'<div class=card style="font-size:1.1rem;line-height:1.7">'+D.t+'</div><div id=qz></div>';quiz($('#qz'),D.rq||[D.q[1]],()=>done(n,'read'))}
 else if(tab==='grammar'){p.innerHTML='<div class=card><h3>'+D.g[0]+'</h3><p>'+D.g[1]+'</p><p class=sm><b>Why here?</b> You need it to complete this lesson’s speaking task.</p></div><div id=qz></div>';quiz($('#qz'),D.g[2],()=>done(n,'grammar'));if(D.g[3]){p.insertAdjacentHTML('beforeend','<h3>Gap-fill</h3><div id=gf></div>');gap($('#gf'),D.g[3])}}
 else if(tab==='speak'){const cr=['Fluency: I spoke without long pauses','Pronunciation: my vowels and stress were clear','Vocabulary: I used words from this lesson','Grammar: I used the target structure','Task: I answered every part of the prompt'];
  p.innerHTML='<div class=card><h3>Your task</h3><p>'+L[n].sp+'</p><p class=sm>Target: speak for '+(L[n].sec||'45 seconds')+'.</p></div><ol><li>Read the task and plan your ideas.</li><li>Listen to the teacher’s model.</li><li><b>Record yourself on your own phone</b> (nothing is uploaded here).</li><li>Listen to your recording and compare it with the model.</li></ol>'+
  (M.model?'<audio controls src="'+M.model+'"></audio>':'<div class=soon>Teacher’s model audio will appear here.</div>')+'<div class=card><h3>Self-assessment</h3>'+cr.map(c=>'<label style="display:block"><input type=checkbox> '+c+'</label>').join('')+'</div>';
  if(L[n].rp)p.insertAdjacentHTML('afterbegin','<h3>Role-plays</h3>'+L[n].rp.map((r,i)=>'<div class=card><b>Situation '+(i+1)+':</b> '+r[0]+'<br><b>Goal:</b> '+r[1]+'<br><span class=sm>'+r[2]+'</span><details><summary>Model answer</summary><p style="white-space:pre-line">'+r[3]+'</p></details></div>').join(''));
  p.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{if(p.querySelectorAll('input:checked').length>=3)done(n,'speak')})}
 else if(tab==='write'){const lim=D.w[2]||[40,60],LK=D.w[3]||['and','but','because'];p.innerHTML='<div class=card><h3>Task</h3><p>'+D.w[0]+'</p><p class=sm><b>Words:</b> '+lim[0]+'–'+lim[1]+' · <b>Audience:</b> your teacher and classmates · <b>Purpose:</b> to show you can use this lesson’s language.</p><p class=sm><b>Useful linking words:</b> '+LK.join(', ')+'</p></div><textarea id=tx aria-label="Your writing"></textarea><p class=sm id=wc>0 words</p><button class="btn pri" id=ck>Check my writing</button> <button class=btn id=md>Show model answer</button><div id=res></div><div class=card id=mo hidden><b>Model answer (shortened example)</b><p style="white-space:pre-line">'+D.w[1]+'</p></div><div class=card><h3>Assessment criteria and self-correction</h3><p class=sm>Task achievement · Organisation · Range of language · Accuracy · British spelling.</p>'+['I answered the task','I checked my verbs and tenses','I used linking words','I used British spelling','I reread it aloud'].map(c=>'<label style="display:block"><input type=checkbox> '+c+'</label>').join('')+'</div>';
  const tx=$('#tx');tx.oninput=()=>$('#wc').textContent=(tx.value.trim()?tx.value.trim().split(/\s+/).length:0)+' words';
  $('#md').onclick=()=>$('#mo').hidden=!$('#mo').hidden;
  $('#ck').onclick=()=>{const t=tx.value,low=t.toLowerCase(),w=t.trim()?t.trim().split(/\s+/).length:0,r=[];
   r.push([w>=lim[0]&&w<=lim[1],'Word count: '+w+' (target '+lim[0]+'–'+lim[1]+')']);
   const lk=LK.filter(x=>low.includes(x)),need=2;r.push([lk.length>=need,'Linking words: '+(lk.join(', ')||'none')+' (aim for '+need+'+)']);
   const am=low.match(/\b(color|favorite|center|organize|neighbor|program|realize)\w*/g)||[];r.push([!am.length,am.length?'American spelling: '+am.join(', ')+' → use British forms (colour, favourite, centre…)':'British spelling: no problems found']);
   r.push([/^[A-Z]/.test(t.trim())&&/[.!?]$/.test(t.trim()),'Starts with a capital letter and ends with punctuation']);
   const er=/\b(i am agree|peoples|he don't|she don't|more better)\b/i.test(t);r.push([!er,er?'Common error found (e.g. “I am agree”, “peoples”)':'None of the common errors on our list were found']);
   $('#res').innerHTML='<div class=card><b>Automatic feedback</b><ul>'+r.map(x=>'<li class='+(x[0]?'good':'bad')+'>'+(x[0]?'✓ ':'✗ ')+x[1]+'</li>').join('')+'</ul><p class=sm>This tool checks form, not ideas. Compare with the model, then ask your teacher.</p></div>';
   if(w>=lim[0])done(n,'write')}}
 else{let ws=[];for(let k=1;k<=n;k++)if(L[k])ws=ws.concat(L[k].v);p.innerHTML='<p>Cumulative revision: words from this and earlier lessons return here.</p><div id=rc></div>';recall($('#rc'),ws)}
 window.scrollTo(0,0)}

function vocab(){app.innerHTML='<h2>Vocabulary bank <span class=ar>قاموس المفردات</span></h2><input type=search id=s placeholder="Search English or Arabic… / ابحث" aria-label="Search words"><label><input type=checkbox id=bl> Hide Arabic (tap a word to reveal it)</label><div class=card id=wl></div>';
 const d=q=>{const m=all().filter(w=>(w[0]+w[2]+w[3]).toLowerCase().includes(q.toLowerCase()));$('#wl').innerHTML=m.length?wordRows(m):'No word found.'};
 $('#s').oninput=e=>d(e.target.value.trim());$('#bl').onchange=e=>$('#wl').classList.toggle('bl',e.target.checked);$('#wl').onclick=e=>{const a=e.target.closest('.ar');if(a)a.style.filter='none'};d('')}
function rev(){app.innerHTML='<h2>Revision <span class=ar>المراجعة</span></h2><p>Words from every lesson come back here. Type the English for each Arabic prompt.</p><div id=rc></div>';recall($('#rc'),all())}
function prog(){let h='<h2>My progress <span class=ar>تقدّمي</span></h2><div class=card>';
 Object.keys(L).forEach(n=>h+='<p><b>Lesson '+TN(+n)+'</b> – '+T[n-1][0]+'<br>'+pct(n,lvl())+'%'+'</p>');
 app.innerHTML=h+'</div><button class=btn id=rs>Reset progress</button>';$('#rs').onclick=()=>{if(confirm('Delete all progress on this device?')){P={};save();prog()}}}
function route(){const h=location.hash.slice(1).split('/');
 if(h[0]==='L')lesson(+h[1],h[2]||'prep');else if(h[0]==='vocab')vocab();else if(h[0]==='rev')rev();else if(h[0]==='prog')prog();else home()}
addEventListener('hashchange',route);route();
</script></body></html>
